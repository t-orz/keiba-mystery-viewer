<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>簡略指数追跡</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <!-- iPhone のホーム画面に追加すると、アプリのように全画面で開く（mini.html?app=1） -->
  <link rel="manifest" href="mini.webmanifest" />
  <link rel="apple-touch-icon" href="assets/mini_icon_180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="指数追跡" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f3f0e8" />
  <style>
    /* ホームズ指数追跡の簡略版（2026-10-26）。発売締切がいちばん近いレース1つだけを正方形で出す。
       大きさは ?size=240 / 320（既定）/ 480。?app=1（ホーム画面から開いたとき）は画面に合わせて最大480、右上に×。中の寸法はすべて 320px 基準の --u 倍で書く。
       色は tracker.html と同じ: 金=1位 / 青=2〜5位 / 緑=6〜10位 / 灰=65未満 */
    :root {
      --bg: #f3f0e8;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --card: #fffcf5;
      --accent: #0b3d2e;
      --rule: rgba(11, 61, 46, 0.16);
      --blue: rgba(66, 133, 244, 0.22);
      --blue-b: rgba(66, 133, 244, 0.55);
      --green: rgba(52, 168, 83, 0.22);
      --green-b: rgba(52, 168, 83, 0.55);
      --gold: rgba(240, 163, 10, 0.34);
      --gold-b: rgba(176, 118, 0, 0.75);
      --holmes-low: #c9c9c9;
      --holmes-low-b: rgba(0, 0, 0, 0.32);
      --next: #c62828;
      --up: #c62828;
      --down: #1565c0;
      --u: 1px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      color: var(--ink);
    }
    .card {
      position: relative;
      width: calc(320 * var(--u));
      height: calc(320 * var(--u));
      overflow: hidden;
      background: var(--card);
      border: calc(3 * var(--u)) solid var(--rule);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .card.rank-top { background: linear-gradient(var(--gold), var(--gold)), var(--card); border-color: var(--gold-b); }
    .card.rank-hi { background: linear-gradient(var(--blue), var(--blue)), var(--card); border-color: var(--blue-b); }
    .card.rank-mid { background: linear-gradient(var(--green), var(--green)), var(--card); border-color: var(--green-b); }
    .card.is-low { background: var(--holmes-low); border-color: var(--holmes-low-b); }
    .box {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.72);
      border: 0 solid rgba(0, 0, 0, 0.35);
    }
    /* 隅の囲いは手書きの図どおり、外枠にくっついた長方形（内側の2辺〜3辺だけ線を引く） */
    .date {
      left: 0; top: 0; width: calc(120 * var(--u)); height: calc(52 * var(--u));
      border-right-width: calc(2 * var(--u)); border-bottom-width: calc(2 * var(--u)); font-size: calc(23 * var(--u));
    }
    /* 日付・秒数・順位の囲いは同じ面積（120×52 ＝ 60×104）。競馬場・レース番号は小さめ */
    .date small { font-size: 0.7em; margin-left: 0.3em; }
    .place, .race { left: 0; width: calc(64 * var(--u)); height: calc(64 * var(--u)); border-right-width: calc(2 * var(--u)); border-bottom-width: calc(2 * var(--u)); }
    .place { top: calc(52 * var(--u)); }
    .place span {
      display: flex; align-items: center; justify-content: center;
      width: calc(44 * var(--u)); height: calc(44 * var(--u));
      border: calc(2 * var(--u)) solid rgba(0, 0, 0, 0.45); border-radius: 50%;
      font-size: calc(24 * var(--u)); font-weight: 700;
    }
    .race { top: calc(116 * var(--u)); font-size: calc(28 * var(--u)); }
    /* 指数は正方形のちょうど真ん中、増減はその真下 */
    .idx {
      position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
      text-align: center;
      font-size: calc(104 * var(--u)); font-weight: 700; color: var(--accent);
    }
    .idx.wide { font-size: calc(78 * var(--u)); }
    .delta {
      position: absolute; left: 0; right: 0; top: calc(214 * var(--u));
      text-align: center; font-size: calc(30 * var(--u)); color: var(--muted);
    }
    .delta.up { color: var(--up); }
    .delta.down { color: var(--down); }
    .secs {
      right: 0; bottom: calc(50 * var(--u));
      width: calc(60 * var(--u)); height: calc(104 * var(--u));
      border-width: calc(2 * var(--u)) 0 0 calc(2 * var(--u));
      font-size: calc(30 * var(--u));
    }
    .secs.d4 { font-size: calc(22 * var(--u)); }
    .secs.d5 { font-size: calc(17 * var(--u)); }
    .secs.soon { color: var(--next); border-color: var(--next); }
    .rank {
      right: 0; bottom: 0; width: calc(120 * var(--u)); height: calc(52 * var(--u));
      border-left-width: calc(2 * var(--u)); border-top-width: calc(2 * var(--u)); font-size: calc(28 * var(--u));
    }
    .rank small { font-size: 0.6em; color: var(--muted); }
    .msg {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: calc(24 * var(--u)); text-align: center; font-size: calc(18 * var(--u)); line-height: 1.5; color: var(--muted);
    }
    /* アプリ表示: 画面の真ん中に四角、その右上の角に×（手書きの図どおり） */
    body.app {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .frame { position: relative; }
    .close {
      display: none;
      position: absolute; top: -22px; right: -22px; z-index: 2;
      width: 44px; height: 44px; padding: 0;
      border: 2px solid rgba(0, 0, 0, 0.45); border-radius: 4px;
      background: var(--card); color: var(--ink);
      font: 28px/1 sans-serif; cursor: pointer;
    }
    body.app .close { display: block; }
    .closed { display: none; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.8; padding: 0 24px; }
    .closed button {
      margin-top: 12px; padding: 10px 22px; font: inherit; color: var(--ink);
      background: var(--card); border: 1px solid var(--rule); border-radius: 8px;
    }
    body.is-closed .frame { display: none; }
    body.is-closed .closed { display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card" id="card" role="status" aria-live="polite"></div>
    <button type="button" class="close" id="closeBtn" aria-label="閉じる">×</button>
  </div>
  <div class="closed" id="closedMsg">
    閉じました（データの読み込みも止めています）<br />
    アプリそのものを終了するには、画面の下から上にスワイプしてください
    <div><button type="button" id="reopenBtn">もう一度表示する</button></div>
  </div>

  <script src="config.js?v=20261025235740"></script>
  <script>
  (function () {
    "use strict";
    const cfg = window.PUBLIC_VIEWER_CONFIG || {};
    const POLL_MS = Math.max(15000, Number(cfg.POLL_INTERVAL_MS) || 30000);
    const LOW = 65;              // tracker.html・app.js と同じ
    const CLOSE_BEFORE_MS = 2 * 60 * 1000;   // JRAの発売締切は発走2分前
    const SIZES = [240, 320, 480];
    const WEEKDAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const PLACE_SHORT = { 東京: "東", 京都: "京", 中山: "中", 阪神: "阪", 札幌: "札", 函館: "函", 福島: "福", 新潟: "新", 中京: "名", 小倉: "小" };

    const params = new URLSearchParams(location.search);
    const size = Number(params.get("size"));
    const appMode = params.get("app") === "1" || navigator.standalone === true
      || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    function fitSize() {
      if (!appMode) {
        document.documentElement.style.setProperty("--u", `${(SIZES.includes(size) ? size : 320) / 320}px`);
        return;
      }
      // 画面に収まる最大（480まで）。右上の×の分だけ余白をとる
      const side = Math.max(200, Math.min(480, window.innerWidth - 56, window.innerHeight - 56));
      document.documentElement.style.setProperty("--u", `${side / 320}px`);
    }
    if (appMode) document.body.classList.add("app");
    fitSize();
    window.addEventListener("resize", fitSize);

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function isObstacle(r) {
      if (r.reference_only && /障害/.test(String(r.reference_only_reason || ""))) return true;
      if (/^障|障害/.test(String(r.course || "").trim())) return true;
      return /障害|ジャンプ/.test(String(r.name || ""));
    }
    function idxNum(r) {
      const s = String(r.holmes_index == null ? "" : r.holmes_index).trim();
      return /^\d+(\.\d+)?$/.test(s) ? Number(s) : null;
    }
    function rnum(r) { return Number(String(r.R || "").replace(/[Rr]$/, "")) || 0; }
    function jstDate(day, hm) {
      const m = String(hm || "").match(/^(\d{1,2}):(\d{2})/);
      if (!m || !day) return null;
      const d = new Date(`${day}T${m[1].padStart(2, "0")}:${m[2]}:00+09:00`);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    let data = null;
    let races = [];
    let error = "";

    function showMsg(text) {
      const c = $("card");
      c.className = "card";
      c.innerHTML = `<div class="msg">${esc(text)}</div>`;
    }

    /** 発売締切がまだ来ていないレースのうち、いちばん近いもの（障害は順位の対象外なので出さない）。 */
    function pickRace(now) {
      let best = null, bestT = Infinity;
      for (const r of races) {
        if (isObstacle(r)) continue;
        const st = jstDate(data.schedule_date, r.start_time);
        if (!st) continue;
        const close = st.getTime() - CLOSE_BEFORE_MS;
        if (close > now && close < bestT) { bestT = close; best = r; }
      }
      return best && { r: best, close: bestT };
    }

    function render() {
      if (error && !data) { showMsg(error); return; }
      if (!data) return;
      if (data.cleared || !races.length) { showMsg("本日の開催はありません"); return; }
      const now = Date.now();
      const p = pickRace(now);
      if (!p) { showMsg("本日の発売はすべて締め切りました"); return; }
      const r = p.r;
      const day = String(data.schedule_date || "");
      const md = day.match(/^\d{4}-(\d{2})-(\d{2})/);
      const v = idxNum(r);
      const pending = r.holmes_rank_text === "算出前" || !r.predicted || v == null;
      const rank = Number(r.holmes_index_rank);
      const m = String(r.holmes_rank_text || "").match(/(\d+)\s*レース中/);
      const total = m ? Number(m[1]) : races.filter((x) => !isObstacle(x)).length;

      const cls = ["card"];
      if (!pending && v < LOW) cls.push("is-low");
      else if (!pending && rank === 1) cls.push("rank-top");
      else if (!pending && rank >= 2 && rank <= 5) cls.push("rank-hi");
      else if (!pending && rank >= 6 && rank <= 10) cls.push("rank-mid");

      let delta = "", dcls = "";
      const dv = Number(r.holmes_morning_delta);
      if (!pending && r.holmes_morning_delta != null && r.holmes_morning_delta !== "" && Number.isFinite(dv)) {
        delta = `(${dv > 0 ? "+" + dv : dv < 0 ? dv : "±0"})`;
        dcls = dv > 0 ? "up" : dv < 0 ? "down" : "";
      }
      const sec = Math.max(0, Math.floor((p.close - now) / 1000));
      const idxText = pending ? "-" : String(v);

      const c = $("card");
      c.className = cls.join(" ");
      c.title = `${r.place || ""}${rnum(r)}R ${r.name || ""} 発走${r.start_time || ""}`;
      c.innerHTML =
        `<div class="box date">${md ? `${Number(md[1])}/${Number(md[2])}<small>${WEEKDAY[new Date(`${day.slice(0, 10)}T00:00:00Z`).getUTCDay()]}</small>` : esc(day)}</div>` +
        `<div class="box place" title="${esc(r.place)}"><span>${esc(PLACE_SHORT[r.place] || String(r.place || "").slice(0, 1))}</span></div>` +
        `<div class="box race">${rnum(r)}</div>` +
        `<div class="idx${idxText.length >= 3 ? " wide" : ""}">${esc(idxText)}</div>` +
        `<div class="delta ${dcls}">${esc(delta)}</div>` +
        `<div class="box secs${sec < 60 ? " soon" : ""}${sec >= 10000 ? " d5" : sec >= 1000 ? " d4" : ""}">${sec}</div>` +
        `<div class="box rank">${pending || !rank ? "-" : rank}<small>&nbsp;/&nbsp;${total}</small></div>` +
        (error ? `<div class="msg" style="inset:auto 0 0 0;padding:4px;font-size:calc(10 * var(--u))">${esc(error)}</div>` : "");
    }

    async function load() {
      const url = String(cfg.SNAPSHOT_URL || "").split("?")[0];
      if (!url) { error = "config.js の SNAPSHOT_URL がありません"; render(); return; }
      try {
        const res = await fetch(`${url}?cb=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const d = await res.json();
        const list = [];
        for (const v of d.venues || []) for (const r of v.races || []) list.push(r.place ? r : { ...r, place: v.place });
        data = d;
        races = list;
        error = "";
      } catch (e) {
        error = `読み込みに失敗しました（${e.message}）。再試行します`;
      }
      render();
    }

    // iPhone ではアプリが自分で終了することはできないので、×は「閉じた画面」にして読み込みと時計を止める。
    // 裏に回して戻ってきたとき（ホーム画面から開き直したとき）は、また表示する
    let pollTimer = 0, tickTimer = 0;
    function start() {
      document.body.classList.remove("is-closed");
      if (pollTimer) return;
      load();
      pollTimer = setInterval(load, POLL_MS);
      tickTimer = setInterval(render, 1000);   // 秒数と、締切を過ぎたら次のレースへの切り替えは手元の時計で進める
    }
    function stop() {
      document.body.classList.add("is-closed");
      clearInterval(pollTimer); clearInterval(tickTimer);
      pollTimer = tickTimer = 0;
    }
    $("closeBtn").addEventListener("click", stop);
    $("reopenBtn").addEventListener("click", start);
    start();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      if (pollTimer) load(); else start();
    });
  })();
  </script>
</body>
</html>
